<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💬 Quotes App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 dark:bg-gray-900 transition-colors duration-300">

  <!-- Header -->
  <header class="bg-white dark:bg-gray-800 shadow p-4 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <h1 class="text-2xl font-bold text-gray-900 dark:text-white">💬 Quotes</h1>
    </div>

    <div class="flex items-center gap-3">
      <!-- <button onclick="toggleDarkMode()" 
        class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition">
        <span id="themeIcon">🌙</span>
      </button> -->
      <button onclick="getRandomQuote()"
        class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg font-semibold transition transform hover:scale-105">
        ✨ New Quote
      </button>
    </div>
  </header>

  <!-- Highlight Quote Section -->
  <section class="p-8 text-center bg-gradient-to-r from-blue-50 to-purple-50 dark:from-gray-800 dark:to-gray-700">
    <div class="max-w-2xl mx-auto">
      <p id="highlightQuote" class="text-2xl md:text-3xl italic font-light text-gray-900 dark:text-white mb-4"></p>
      <p id="highlightAuthor" class="text-lg text-gray-600 dark:text-gray-300 mb-6"></p>
      <button onclick="copyHighlightQuote()"
        class="bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-lg font-semibold transition transform hover:scale-105">
        📋 Copy Quote
      </button>
    </div>
  </section>

  <!-- Search and Filter Section -->
  <section class="p-6 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
    <div class="max-w-2xl mx-auto flex flex-col sm:flex-row gap-4">
      <input type="text" id="searchInput" placeholder="🔍 Search by author..."
        class="flex-1 px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
        onkeyup="filterQuotes()">
      <button onclick="showAllQuotes()"
        class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg font-semibold transition">
        Reset
      </button>
      <button onclick="showFavorites()"
        class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg font-semibold transition">
        ❤️ Favorites (<span id="favCount">0</span>)
      </button>
    </div>
  </section>

  <!-- Loader -->
  <p id="loader" class="text-center py-8 text-gray-600 dark:text-gray-400 text-lg">⏳ Loading quotes...</p>

  <!-- Error -->
  <p id="error" class="text-center py-8 text-red-500 font-semibold text-lg"></p>

  <!-- Quotes Grid -->
  <main class="p-6">
    <div id="quotes"
      class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
    </div>
  </main>

  <!-- Empty State -->
  <div id="emptyState" class="hidden text-center py-12">
    <p class="text-gray-600 dark:text-gray-400 text-lg">No quotes found. Try a different search or reset.</p>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg hidden">
    <span id="toastMessage"></span>
  </div>

<script src="app.js"></script>
</body>
</html>
